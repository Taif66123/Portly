name: Windows evidence gate

# Real kills of servers the tests start, on every Windows runner. Stopping stays switched off on
# Windows until this passes everywhere and the maintainer opens gate_windows.go.
on:
  push:
    paths: ["internal/**", "tests/e2e/**", "cmd/**", "go.mod", "go.sum", ".github/workflows/windows-gate.yml"]
  pull_request:
    paths: ["internal/**", "tests/e2e/**", "cmd/**", "go.mod", "go.sum", ".github/workflows/windows-gate.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Servers for the Windows evidence gate
        run: "python -m pip install --only-binary :all: Flask==3.1.3 Django==6.1.3 uvicorn==0.54.0"
      - name: Evidence build unit tests
        run: go test -count=1 -tags portly_evidence ./internal/modules/stopper/
      - name: Real kills, and the release build still refuses
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -p 1 -timeout 15m -v ./tests/e2e 2>&1 | tee gate.txt
          # A skipped server is not evidence
          if grep -q -- '--- SKIP' gate.txt; then echo "nothing was proven: a gate test was skipped"; exit 1; fi
